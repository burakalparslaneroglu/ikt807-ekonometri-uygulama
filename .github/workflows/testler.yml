name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # dönem boyunca sabit; Ubuntu 26 geçişi bilinçli yapılacak
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # derlenmiş (binary) paketler: AER ve haven dakikalar yerine saniyelerde kurulur

      - name: R paketleri
        run: Rscript -e 'install.packages(c("sandwich", "lmtest", "haven", "AER", "quantreg"), repos = "https://cloud.r-project.org")'

      - name: Python bağımlılıkları
        run: python -m pip install -r requirements-dev.txt

      - name: Hansen verisi (depoya eklenmez, yalnız test için indirilir)
        run: |
          curl -fsSL -o hansen.zip "https://users.ssc.wisc.edu/~behansen/econometrics/Econometrics%20Data.zip"
          python - <<'PY'
          import pathlib, zipfile
          bundle = zipfile.ZipFile("hansen.zip")
          pathlib.Path("veri").mkdir(exist_ok=True)
          for member in ("cps09mar.txt", "DDK2011.dta", "Card1995.dta", "CHJ2004.dta"):
              name = next(n for n in bundle.namelist() if n.lower().rsplit("/", 1)[-1] == member.lower())
              pathlib.Path("veri", member).write_bytes(bundle.read(name))
              print("Arşivdeki yol:", name)
          PY
          rm hansen.zip
          echo "IKT807_HANSEN_CPS09MAR_PATH=$PWD/veri/cps09mar.txt" >> "$GITHUB_ENV"
          echo "IKT807_HANSEN_DDK2011_PATH=$PWD/veri/DDK2011.dta" >> "$GITHUB_ENV"
          echo "IKT807_HANSEN_CARD1995_PATH=$PWD/veri/Card1995.dta" >> "$GITHUB_ENV"
          echo "IKT807_HANSEN_CHJ2004_PATH=$PWD/veri/CHJ2004.dta" >> "$GITHUB_ENV"

      - name: Testler (Python + R, notlardaki sayılarla)
        run: python -m pytest -q

      - name: Derleme kontrolü
        run: python -m compileall -q app.py core topics tests
