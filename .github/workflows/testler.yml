name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2

      - name: R paketleri
        run: Rscript -e 'install.packages(c("sandwich", "lmtest"), repos = "https://cloud.r-project.org")'

      - name: Python bağımlılıkları
        run: python -m pip install -r requirements-dev.txt

      - name: Hansen verisi (depoya eklenmez, yalnız test için indirilir)
        run: |
          curl -fsSL -o hansen.zip "https://users.ssc.wisc.edu/~behansen/econometrics/Econometrics%20Data.zip"
          python - <<'PY'
          import pathlib, zipfile
          bundle = zipfile.ZipFile("hansen.zip")
          name = next(n for n in bundle.namelist() if n.lower().rsplit("/", 1)[-1] == "cps09mar.txt")
          pathlib.Path("veri").mkdir(exist_ok=True)
          pathlib.Path("veri/cps09mar.txt").write_bytes(bundle.read(name))
          print("Arşivdeki yol:", name)
          PY
          echo "IKT807_HANSEN_CPS09MAR_PATH=$PWD/veri/cps09mar.txt" >> "$GITHUB_ENV"

      - name: Testler (Python + R, notlardaki sayılarla)
        run: python -m pytest -q

      - name: Derleme kontrolü
        run: python -m compileall -q app.py core topics tests
